image:
  repository: docker-local.artifactory.servicenow.net/gitlab.servicenow.net/snowsk8s/apps/pyramidanalytics/postgres
  tag: "17"

storage:
  size: 10Gi
  className: titanium
  instanceId: ""

auth:
  adminPassword: postgres
  app:
    database: pyramid
    user: pyramid
    password: pyramid

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  fsGroup: 999

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 999
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
