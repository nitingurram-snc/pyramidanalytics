apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: base-role
  labels:
    {{- include "pyramidAnalytics.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [ "get" ]
  - apiGroups: [ "" ]
    resources: [ "persistentvolumeclaims" ]
    verbs: [ "list" ]
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "get","list","create","delete","deletecollection","patch" ]
  - apiGroups: [ "" ]
    resources: [ "services" ]
    verbs: [ "get", "create", "delete", "list","deletecollection" ]
  - apiGroups: [ "coordination.k8s.io" ]
    resources: [ "leases" ]
    verbs: [ "get", "update" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: installer-role
  labels:
    {{- include "pyramidAnalytics.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["update", "create", "delete"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pa-service
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: installer-service
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: base-role-binding
subjects:
  - kind: ServiceAccount
    name: pa-service
  - kind: ServiceAccount
    name: installer-service
roleRef:
  kind: Role
  name: base-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: installer-role-binding
subjects:
  - kind: ServiceAccount
    name: installer-service
roleRef:
  kind: Role
  name: installer-role
  apiGroup: rbac.authorization.k8s.io
