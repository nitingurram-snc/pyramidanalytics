{{- if .Values.te.kedaAutoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: te-scaled
spec:
  scaleTargetRef:
    name: task-service
  pollingInterval: 15
  cooldownPeriod: 10
  minReplicaCount: {{.Values.te.kedaAutoscaling.minReplicas}}
  maxReplicaCount: {{.Values.te.kedaAutoscaling.maxReplicas}}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: "http://prometheus-service:9090"
        metricName: pyramid_te_scale
        threshold: "100"
        query: max(pyramid_te_scale)
{{- end }}
