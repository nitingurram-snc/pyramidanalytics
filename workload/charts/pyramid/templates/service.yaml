apiVersion: v1
kind: Service
metadata:
  name: pyramid
  labels:
    app: pyramid
    {{- include "pyramidAnalytics.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    app: paws
  type: {{ .Values.service.type }}
  ports:
    - name: "http"
      port: {{.Values.ws.port}}
      targetPort: 8181
---
apiVersion: v1
kind: Service
metadata:
  name: pyramid-ws-metrics
  labels:
    app: pyramid-ws-metrics
    {{- include "pyramidAnalytics.labels" . | nindent 4 }}
  annotations:
    prometheus.io/port: "9090"
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metricsfull"
spec:
  selector:
    app: paws
  type: ClusterIP
  ports:
    - name: "metrics"
      port: 9090
      targetPort: 9090
---
