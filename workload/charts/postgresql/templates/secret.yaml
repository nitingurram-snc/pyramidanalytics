{{- if not .Values.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.auth.adminPassword | b64enc | quote }}
  pyramid-password: {{ .Values.auth.app.password | b64enc | quote }}
{{- end }}
